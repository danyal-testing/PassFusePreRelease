name: Validate

# Runs on every push and pull request to keep the codebase healthy:
# Syntax, lint, formatting, unit, browser, responsive and offline checks.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Quality and browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies from lockfile
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Syntax check (node --check)
        run: |
          for file in js/*.js sw.js scripts/*.mjs tests/*.mjs; do
            node --check "$file"
          done

      - name: Full validation suite (ESLint, Prettier, Unit & Playwright E2E)
        run: npm run validate
