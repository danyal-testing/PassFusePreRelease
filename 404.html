<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Page not found — PassFuse</title>
    <meta
      name="description"
      content="The requested page could not be found. Return to the PassFuse password generator."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#090B0F" data-theme-color />
    <meta name="robots" content="noindex" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="images/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="images/favicon-48.png"
    />
    <link rel="icon" type="image/svg+xml" href="images/logo-rounded.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/apple-touch-icon.png"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Set theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          let t = localStorage.getItem("pg-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia?.("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          const m = document.querySelector("[data-theme-color]");
          if (m)
            m.setAttribute("content", t === "light" ? "#F3F5F8" : "#090B0F");
        } catch {
          /* ignore restricted storage */
        }
      })();
    </script>
    <script src="js/config.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <div class="ambient-background" aria-hidden="true"></div>
    <main class="generator" aria-labelledby="notfound-title">
      <header class="generator__header">
        <div class="generator__brand">
          <svg
            class="generator__logo"
            viewBox="124 140 269 232"
            aria-hidden="true"
            focusable="false"
          >
            <g class="generator__logo-primary">
              <polygon points="208,144 257,144 177,272 128,272" />
              <polygon points="276,144 325,144 185,368 136,368" />
            </g>
            <g class="generator__logo-accent">
              <path d="M 325 144 A 64 64 0 0 1 325 272 Z" />
              <polygon
                points="263,272 325,272 325,320 283,320 253,368 204,368"
              />
            </g>
          </svg>
          <span class="generator__title">PASSWORD GENERATOR</span>
        </div>

        <button
          class="theme-toggle"
          type="button"
          data-theme-toggle
          aria-pressed="false"
          title="Switch theme"
        >
          <span class="visually-hidden" data-theme-label
            >Switch to light theme</span
          >
          <svg
            class="theme-toggle__icon theme-toggle__icon--sun"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
            <path
              d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"
            />
          </svg>
          <svg
            class="theme-toggle__icon theme-toggle__icon--moon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"
            />
          </svg>
        </button>
      </header>

      <div class="card notfound">
        <div class="notfound__mark" aria-hidden="true">
          <svg
            class="notfound__logo"
            viewBox="124 140 269 232"
            aria-hidden="true"
            focusable="false"
          >
            <g class="generator__logo-primary">
              <polygon points="208,144 257,144 177,272 128,272" />
              <polygon points="276,144 325,144 185,368 136,368" />
            </g>
            <g class="generator__logo-accent">
              <path d="M 325 144 A 64 64 0 0 1 325 272 Z" />
              <polygon
                points="263,272 325,272 325,320 283,320 253,368 204,368"
              />
            </g>
          </svg>
        </div>
        <p class="notfound__code">404</p>
        <h1 class="notfound__title" id="notfound-title">Page not found</h1>
        <p class="notfound__text">
          The page you were looking for doesn’t exist or may have moved.
        </p>
        <a class="btn btn--primary notfound__home" href="./">
          <span class="btn__label">BACK TO PASSFUSE</span>
          <svg
            class="btn__icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M5 12l14 0" />
            <path d="M13 18l6 -6" />
            <path d="M13 6l6 6" />
          </svg>
        </a>
      </div>
    </main>
  </body>
</html>
